[font]
normal = { family = "JetBrains Mono", style = "Regular" }
size = 12.0

[colors.primary]
background = "#000000"
foreground = "#ff9999"

[colors.cursor]
text = "#000000"
cursor = "#ff1a1a"

[colors.selection]
text = "#000000"
background = "#330a0a"

[colors.normal]
black = "#000000"
red = "#ff1a1a"
green = "#8a1f1f"
yellow = "#ff8c42"
blue = "#b30000"
magenta = "#ff4d6a"
cyan = "#ff6b6b"
white = "#ff9999"

[colors.bright]
black = "#330a0a"
red = "#ff4d4d"
green = "#b34d4d"
yellow = "#ffb366"
blue = "#ff1a1a"
magenta = "#ff8099"
cyan = "#ff9999"
white = "#ffffff"

[window]
opacity = 0.8
padding = { x = 8, y = 8 }
decorations = "None"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "r"

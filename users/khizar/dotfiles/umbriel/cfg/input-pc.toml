# From mango cfg/input.conf

[input.keyboard]
layout = "us"
numlock_toggle = true
repeat_rate = 25
repeat_delay = 600

[input.touchpad]
tap = true
tap_and_drag = true
drag_lock = "timeout"
natural_scroll = true
scroll_factor = 1.0
accel_profile = "flat"
sensitivity = 0.0
disable_while_typing = true
left_handed = false

[input.mouse]
natural_scroll = false
accel_profile = "flat"
sensitivity = 0.0

# Laptop-only device, harmless on the PC where it never matches.
[[input.device]]
name = "TPPS/2 Elan TrackPoint"
accel_profile = "flat"
sensitivity = 0.0

# sloppy_focus=0
[input.focus]
follows_mouse = false

# cursor_theme, cursor_size, and warp_cursor=1 as follows_focus.
[input.cursor]
theme = "capitaine-cursors"
size = 24
follows_focus = true

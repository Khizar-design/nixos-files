# From niri cfg/animation.kdl. Niri's springs carry over directly; a spring sets its
# own duration. damping-ratio=1.0 stiffness=N is spring:1,N.

[animation]
enabled = true

# window-open 200ms ease-out-quad. Niri's open scales up from 0.5 while fading.
[animation.windows_in]
style = "popin"
scale = 0.5
duration_ms = 200
curve = "0.25,0.46,0.45,0.94"

# window-close 200ms ease-out-cubic.
[animation.windows_out]
style = "popin"
scale = 0.8
duration_ms = 200
curve = "0.215,0.61,0.355,1"

[animation.windows_move]
curve = "spring:1,800"

[animation.windows_resize]
curve = "spring:1,1000"

[animation.workspaces]
style = "slide"
curve = "spring:1,1000"

[animation.overview]
curve = "spring:1,900"

# Niri's focus ring changes colour instantly.
[animation.border]
enabled = false

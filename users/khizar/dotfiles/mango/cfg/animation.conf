# From niri cfg/animation.kdl. niri uses springs; mango uses duration + bezier,
# so these are eyeballed to match the feel, not the maths.

animations=1
layer_animations=1

animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1

zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8

# niri: window-open/close 200ms ease-out-quad/cubic
animation_duration_open=200
animation_duration_close=200
animation_duration_move=250
animation_duration_tag=250
animation_duration_focus=0

animation_curve_open=0.25,1,0.5,1
animation_curve_close=0.25,1,0.5,1
animation_curve_move=0.25,1,0.5,1
animation_curve_tag=0.25,1,0.5,1
animation_curve_focus=0.25,1,0.5,1
animation_curve_opafadein=0.25,1,0.5,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5

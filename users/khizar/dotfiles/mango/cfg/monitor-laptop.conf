monitorrule=name:eDP-1,scale:1.2,width:1920,height:1200,refresh:60,x:0,y:0

# Dummy HDMI plug — streamed to iPad Pro 13" via Sunshine/Moonlight.
# x must equal eDP-1's logical width so the two outputs touch; any gap and the
# pointer cannot cross onto this output at all. That is eDP-1's own scale, not
# this one's: 1920/1.2 = 1600, NOT 1920/1.1 = 1745.
# Use 1599, not 1600 — mango stores scale as a float (1.2000000476837158), so
# 1920/scale floors to 1599, and x:1600 leaves a 1px gap. Verify with:
#   mmsg get all-monitors   ->  eDP-1 x+width must equal HDMI-A-1 x
# scale only changes apparent size; Sunshine still captures the full 2560x1600, so
# raising it does not affect the stream. 1.75 makes text on the 13" iPad the same
# physical size as on the laptop panel (1462 logical px across ~10.4" vs 1600 across
# ~11.9"). Lower = more desktop, smaller text.
monitorrule=name:HDMI-A-1,scale:1.75,width:2560,height:1600,refresh:59.972,x:1599,y:0

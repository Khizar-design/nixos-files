# From niri cfg/layout.kdl + cfg/misc.kdl

# gaps 1
gap_inner_horizontal=1
gap_inner_vertical=1
gap_outer_horizontal=1
gap_outer_vertical=1
smart_gaps=0

# focus-ring { width 1; active #5a7371; inactive #505050 } — niri's border was off
border_px=1
focus_color=0x5a7371ff
border_color=0x505050ff
no_border_when_single=0

# geometry-corner-radius 5
border_radius=5
no_radius_when_single=0

focused_opacity=1.0
unfocused_opacity=1.0

# cursor { xcursor-theme "capitaine-cursors"; xcursor-size 24 }
cursor_theme=capitaine-cursors
cursor_size=24

# Effects niri did not have.
blur=0
shadows=0
layer_shadows=0

root_color=0x201b14ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# From niri cfg/layout.kdl + cfg/misc.kdl

# gaps 1
gappih=1
gappiv=1
gappoh=1
gappov=1
smartgaps=0

# focus-ring { width 1; active #5a7371; inactive #505050 } — niri's border was off
borderpx=1
focuscolor=0x5a7371ff
bordercolor=0x505050ff
no_border_when_single=0

# geometry-corner-radius 5
border_radius=5
no_radius_when_single=0

focused_opacity=1.0
unfocused_opacity=1.0

# cursor { xcursor-theme "capitaine-cursors"; xcursor-size 24 }
cursor_theme=capitaine-cursors
cursor_size=24

# Effects niri did not have.
blur=0
shadows=0
layer_shadows=0

rootcolor=0x201b14ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

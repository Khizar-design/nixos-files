# From niri cfg/keybinds.kdl. niri's Mod is Super.

# ─── Applications ───
bind=SUPER,Return,spawn,alacritty
bind=SUPER,d,spawn_shell,noctalia-shell ipc call launcher toggle
bind=SUPER+SHIFT,d,spawn,rofi -show drun
bind=SUPER,b,spawn,zen
bind=SUPER,n,spawn,obsidian
bind=SUPER+ALT,l,spawn_shell,noctalia-shell ipc call lockScreen lock
bind=SUPER+SHIFT,q,spawn_shell,noctalia-shell ipc call sessionMenu toggle
bind=SUPER,e,spawn,thunar
bind=SUPER,v,spawn_shell,noctalia-shell ipc call launcher clipboard
bind=SUPER+SHIFT,v,spawn_shell,cliphist list | rofi -dmenu | cliphist decode | wl-copy

# ─── Media Controls ───
bind=NONE,XF86AudioRaiseVolume,spawn_shell,noctalia-shell ipc call volume increase
bind=NONE,XF86AudioLowerVolume,spawn_shell,noctalia-shell ipc call volume decrease
bind=NONE,XF86AudioMute,spawn_shell,noctalia-shell ipc call volume muteOutput
bind=NONE,XF86AudioMicMute,spawn_shell,noctalia-shell ipc call volume muteInput
bind=NONE,XF86AudioNext,spawn_shell,noctalia-shell ipc call media next
bind=NONE,XF86AudioPrev,spawn_shell,noctalia-shell ipc call media previous
bind=NONE,XF86AudioPlay,spawn_shell,noctalia-shell ipc call media playPause
bind=NONE,XF86AudioPause,spawn_shell,noctalia-shell ipc call media playPause

# ─── Brightness Controls ───
bind=NONE,XF86MonBrightnessUp,spawn_shell,noctalia-shell ipc call brightness increase
bind=NONE,XF86MonBrightnessDown,spawn_shell,noctalia-shell ipc call brightness decrease

# ─── Window Movement and Focus ───
bind=SUPER,q,killclient,

bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,l,exchange_client,right
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,j,exchange_client,down

bind=SUPER+SHIFT,h,focusmon,left
bind=SUPER+SHIFT,l,focusmon,right
bind=SUPER+SHIFT,k,focusmon,up
bind=SUPER+SHIFT,j,focusmon,down

bind=SUPER+SHIFT+CTRL,h,tagmon,left
bind=SUPER+SHIFT+CTRL,l,tagmon,right
bind=SUPER+SHIFT+CTRL,k,tagmon,up
bind=SUPER+SHIFT+CTRL,j,tagmon,down

# ─── Workspace Switching (niri workspaces → mango tags) ───
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# focus-workspace-previous
bind=SUPER,Tab,togglejump,

# ─── Layout Controls ───
bind=SUPER+CTRL,f,togglemaximizescreen,
bind=SUPER,c,zoom,
# set-column-width -10% / +10%. set_proportion is the scroller equivalent;
# setmfact only does anything in the master-stack layouts.
bind=SUPER,minus,set_proportion,-0.1
bind=SUPER,equal,set_proportion,+0.1
# Full width, and cycle scroller_proportion_preset (niri's preset-column-widths).
bind=SUPER,r,set_proportion,1.0
bind=SUPER+SHIFT,r,switch_proportion_preset,
bind=SUPER+SHIFT,minus,smartresizewin,+0,-50
bind=SUPER+SHIFT,equal,smartresizewin,+0,+50

# ─── Modes ───
bind=SUPER,t,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=SUPER,w,setlayout,tile
bind=SUPER+SHIFT,w,setlayout,scroller
bind=SUPER,o,toggleoverview,

# Cycle through every available mango layout.
bind=SUPER,space,switch_layout,

# Jump straight to a specific layout — every layout mango ships. F1-F12
# covers 12 of the 14; the last 2 spill onto SUPER+SHIFT,F1/F2.
bind=SUPER,F1,setlayout,tile
bind=SUPER,F2,setlayout,scroller
bind=SUPER,F3,setlayout,grid
bind=SUPER,F4,setlayout,monocle
bind=SUPER,F5,setlayout,deck
bind=SUPER,F6,setlayout,dwindle
bind=SUPER,F7,setlayout,fair
bind=SUPER,F8,setlayout,center_tile
bind=SUPER,F9,setlayout,vertical_tile
bind=SUPER,F10,setlayout,right_tile
bind=SUPER,F11,setlayout,vertical_scroller
bind=SUPER,F12,setlayout,vertical_grid
bind=SUPER+SHIFT,F1,setlayout,vertical_deck
bind=SUPER+SHIFT,F2,setlayout,vertical_fair

# ─── Screenshots (niri had these built in; mango needs grim/slurp) ───
bind=CTRL+SHIFT,1,spawn_shell,grim -g "$(slurp)" - | wl-copy
bind=CTRL+SHIFT,2,spawn_shell,grim ~/Pictures/Screenshots/$(date +%Y-%m-%dT%H:%M:%S).png
bind=CTRL+SHIFT,3,spawn_shell,grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%dT%H:%M:%S).png

# ─── Exit / Power ───
bind=CTRL+ALT,Delete,quit,
bind=SUPER+SHIFT,p,spawn_shell,noctalia-shell ipc call monitors off

# ─── Config ───
# Was SUPER+SHIFT,r, which collided with switch_proportion_preset above.
bind=SUPER+CTRL,r,reload_config,

# ─── Mouse / Axis (mango-only; niri has no equivalent binds) ───
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

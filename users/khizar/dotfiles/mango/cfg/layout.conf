# From niri cfg/layout.kdl + cfg/misc.kdl

tag_num=9
new_is_master=1
default_mfact=0.55
default_nmaster=1

# preset-column-widths { 0.33333, 0.5, 0.66667 } — used by the scroller layout
scroller_proportion_preset=0.33333,0.5,0.66667
scroller_default_proportion=0.5
scroller_default_proportion_single=1.0
scroller_structs=20
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0

dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# gestures { hot-corners { off } }
enable_hotarea=0
hotarea_size=10
ov_tab_mode=1
overviewgappi=5
overviewgappo=30

# center-focused-column "never"
focus_on_activate=1
focus_cross_monitor=0
focus_cross_tag=0
idleinhibit_ignore_visible=0
enable_floating_snap=0
snap_distance=30
drag_tile_to_tile=1
drag_tile_small=1
axis_bind_apply_timeout=100
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

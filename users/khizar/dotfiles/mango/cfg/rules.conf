# From niri cfg/rules.kdl.
# niri workspaces main/net/notes are tags 1/2/3 here.

# zen → "net", full width
windowrule=appid:zen,tags:2

# open-fullscreen true
windowrule=appid:md.Obsidian,tags:3,isfullscreen:1
windowrule=appid:teams-for-linux,isfullscreen:1

# equibop: PC only (open-on-output "DP-1"); monitor index 1 is the right screen.
windowrule=appid:equibop,isfullscreen:1,monitor:1

# steam: floating except the main window
windowrule=appid:steam,isfloating:1
windowrule=appid:steam,title:Steam,isfloating:0
windowrule=appid:steam,title:notificationtoasts,isfloating:1,isopensilent:1

# draw-border-with-background false
windowrule=appid:Alacritty,isnoborder:0

# All tags use the tile layout — niri only ever had its one scrolling layout.
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

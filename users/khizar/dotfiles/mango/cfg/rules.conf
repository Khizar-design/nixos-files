# From niri cfg/rules.kdl.
# niri workspaces main/net/notes are tags 1/2/3 here.

# zen → "net", default-column-width { proportion 1.0; }
windowrule=appid:zen,tags:2,scroller_proportion:1.0

# open-fullscreen true
windowrule=appid:md.Obsidian,tags:3,isfullscreen:1
windowrule=appid:teams-for-linux,isfullscreen:1

# equibop: PC only (open-on-output "DP-1"); monitor index 1 is the right screen.
# Full column width in the scroller layout, not actual OS fullscreen (bar/borders stay visible).
windowrule=appid:equibop,monitor:1,scroller_proportion:1.0

# steam: floating except the main window
windowrule=appid:steam,isfloating:1
windowrule=appid:steam,title:Steam,isfloating:0
windowrule=appid:steam,title:notificationtoasts,isfloating:1,isopensilent:1

# draw-border-with-background false
windowrule=appid:Alacritty,isnoborder:0

# Scroller is the closest match to niri's scrolling column layout.
# Mod+W / Mod+Shift+W switch a tag to tile / scroller at runtime.
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

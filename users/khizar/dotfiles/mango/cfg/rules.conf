# From niri cfg/rules.kdl.
# niri workspaces main/net/notes are tags 1/2/3 here.

# zen, default-column-width { proportion 1.0; }. No tags: here — which tag it
# gets depends on the focused monitor, so mango-zen-placer (autostart) moves it.
window_rule=app_id:zen-beta,scroller_proportion:1.0

# proton mail: autostarted on PC, parked on the Equibop screen's tag 2.
# istagsilent: don't switch DP-1's view to tag 2 when it opens. It usually maps
# before Equibop, and would otherwise leave DP-1 showing tag 2 at login.
window_rule=app_id:proton-mail,monitor:^DP-1$,tags:2,is_tag_silent:1

# open-fullscreen true
window_rule=app_id:md.obsidian.Obsidian,tags:3,is_fullscreen:1
window_rule=app_id:teams-for-linux,is_fullscreen:1

# equibop: PC only (open-on-output "DP-1"); monitor index 1 is the right screen.
# Full column width in the scroller layout, not actual OS fullscreen (bar/borders stay visible).
# tags:1 so it never inherits whatever tag DP-1 happens to be showing.
window_rule=app_id:equibop,monitor:1,tags:1,scroller_proportion:1.0

# Noctalia's settings window, floating at its own size (noctalia's niri docs;
# same rule in niri cfg/rules.kdl).
window_rule=app_id:dev.noctalia.Noctalia,is_floating:1,width:1080,height:920

# steam: floating except the main window
window_rule=app_id:steam,is_floating:1
window_rule=app_id:steam,title:Steam,is_floating:0
window_rule=app_id:steam,title:notificationtoasts,is_floating:1,is_open_silent:1

# draw-border-with-background false
window_rule=app_id:Alacritty,no_border:0

# Tile is the default on every tag; switch a tag at runtime with SUPER+space
# (cycle), SUPER+F1-F9 (jump to a specific layout), or SUPER+W / SUPER+SHIFT+W
# (tile / scroller).
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

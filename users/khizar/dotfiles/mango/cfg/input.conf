# From niri cfg/input.kdl

# keyboard { numlock }
numlockon=1
xkb_rules_layout=us
repeat_rate=25
repeat_delay=600

# touchpad { tap; natural-scroll; scroll-factor 0.3; accel-speed 0 }
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_scroll_factor=1.0
trackpad_accel_profile=flat
trackpad_accel_speed=0.0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse { accel-profile "flat"; accel-speed 0.0 }
mouse_natural_scrolling=0
mouse_accel_profile=flat
mouse_accel_speed=0.0

# trackpoint { accel-profile "flat"; accel-speed 0 }
# mango has no trackpoint_* keys; per-device settings go through devicerule.
# Laptop-only device, harmless on the PC where it never matches.
devicerule=name:TPPS/2 Elan TrackPoint,accel_profile:flat,accel_speed:0.0

# focus-follows-mouse was commented out in niri, so off here too.
sloppyfocus=0
warpcursor=1

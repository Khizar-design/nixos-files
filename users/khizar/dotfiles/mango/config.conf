# Options reference: https://github.com/DreamMaoMao/mango/wiki/
# Laid out to mirror ~/nixos/users/khizar/dotfiles/niri/config.kdl.

source = ./cfg/animation.conf
source = ./cfg/appearance.conf
source = ./cfg/input.conf
source = ./cfg/keybinds.conf
source = ./cfg/layout.conf
source = ./cfg/monitor.conf
source = ./cfg/rules.conf

# Per-host script, picked in compositors/mango.nix.
# exec-once runs through wordexp(), so the ~ expands.
exec-once=~/.config/mango/autostart.sh

# Noctalia's template-apply.sh greps this file for the literal string
#   source = /home/khizar/.config/mango/noctalia.conf
# and only rewrites config.conf when it is missing. Finding it in this comment
# leaves our read-only symlink alone. Keep the include last — it overrides the
# colours set above.
source-optional = ~/.config/mango/noctalia.conf
